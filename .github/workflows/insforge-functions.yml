name: InsForge functions

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: insforge-functions-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy InsForge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      INSFORGE_API_BASE_URL: https://y26ze9je.us-east.insforge.app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block automatic deploy for backend state changes
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! git diff --quiet HEAD^ HEAD -- migrations insforge.toml; then
            echo "This merge changes migrations or InsForge config. Apply those live changes first, then replay this workflow from main."
            exit 1
          fi

      - name: Require InsForge project API key
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          if [ -z "$INSFORGE_API_KEY" ]; then
            echo "Add repository secret INSFORGE_API_KEY from the linked Todo App project."
            echo "GitHub, not a laptop or cloud agent, is what deploys functions after CI is green on main."
            exit 1
          fi

      - name: Deploy changed functions and verify live source
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          npx -y --offline @insforge/cli@0.2.6 link --api-base-url "$INSFORGE_API_BASE_URL" --api-key "$INSFORGE_API_KEY" -y
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            npm run sync:insforge-functions -- --deploy-all --check
          else
            npm run sync:insforge-functions -- --deploy-changed --base HEAD^ --head HEAD --check
          fi
