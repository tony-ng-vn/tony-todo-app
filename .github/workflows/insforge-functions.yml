name: InsForge functions

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: insforge-functions-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy InsForge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      INSFORGE_PROJECT_ID: 7e77e15d-9e4d-4591-9951-8b99289200cd

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require InsForge user API key
        env:
          INSFORGE_USER_API_KEY: ${{ secrets.INSFORGE_USER_API_KEY }}
        run: |
          if [ -z "$INSFORGE_USER_API_KEY" ]; then
            echo "Add repository secret INSFORGE_USER_API_KEY from InsForge Profile → API Keys (a uak_ key)."
            echo "GitHub, not a laptop or cloud agent, is what deploys functions after CI is green on main."
            exit 1
          fi

      - name: Deploy changed functions and verify live source
        env:
          INSFORGE_USER_API_KEY: ${{ secrets.INSFORGE_USER_API_KEY }}
        run: |
          npx -y @insforge/cli login --user-api-key "$INSFORGE_USER_API_KEY"
          npx -y @insforge/cli link --project-id "$INSFORGE_PROJECT_ID" -y
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            npm run sync:insforge-functions -- --deploy-all --check
          else
            npm run sync:insforge-functions -- --deploy-changed --base HEAD^ --head HEAD --check
          fi
