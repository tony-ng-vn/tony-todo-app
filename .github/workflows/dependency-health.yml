name: Dependency health

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

concurrency:
  group: dependency-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm run audit:dependencies

      - name: Build failure packet self-test
        run: npm run ci:selftest-packet

      - name: Upload failure packet self-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-learning-selftest-${{ github.run_id }}
          path: .ci-learning/selftest-failure.json
          if-no-files-found: error
          retention-days: 1
